<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it env(safe-area-inset-*) is always 0 on a phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Touch pad demo</title>
    <!--
      The touch pad on its own: pick a console, press "Play", and the pad takes the
      bottom half (portrait) or the sides (landscape), as the game would see it. Like
      the main demo it runs from `site/demo/`, where `make site` puts the built
      `../src/engine-specs.js`.

      Open it on a phone, or in a desktop browser's device mode. On a desktop without
      touch the pad is forced on ("always"), so it can be tried with the mouse.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #07080c;
        --panel: rgb(18 20 28 / 0.92);
        --line: rgb(255 255 255 / 0.12);
        --text: #f4f6fb;
        --muted: #8e97a9;
        --accent: #ff007f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
      #screen { position: fixed; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(120% 90% at 30% 20%, #1e3a8a, #0b1020 60%, #05060a); }
      #screen canvas { width: 100%; height: 100%; display: block; }
      #menu { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
      #menu[hidden], #screen[hidden] { display: none; }
      .card { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line);
        border-radius: 22px; padding: 20px; display: grid; gap: 16px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; color: var(--muted); }
      .systems { display: flex; flex-wrap: wrap; gap: 8px; }
      button { font: inherit; color: inherit; background: rgb(255 255 255 / 0.06); border: 1px solid var(--line);
        border-radius: 999px; padding: 10px 16px; min-height: 48px; cursor: pointer; }
      button[aria-pressed="true"] { border-color: var(--accent); background: rgb(255 0 127 / 0.18); }
      button:focus-visible { outline: none; box-shadow: 0 0 0 3px #fff; }
      #play { background: var(--accent); border-color: var(--accent); font-weight: 700; }
      label { display: grid; gap: 6px; color: var(--muted); }
      input[type="range"] { width: 100%; }
      #log { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); min-height: 1.5em; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="screen" hidden><canvas width="320" height="240"></canvas></div>

    <div id="menu">
      <div class="card">
        <h1>Touch pad</h1>
        <p>
          One layout per console. In portrait the pad takes the bottom half; in landscape it
          sits on the sides. The pause button (top) brings you back here.
        </p>
        <div class="systems" role="group" aria-label="Console"></div>
        <label>Opacity <input id="opacity" type="range" min="0.2" max="1" step="0.05" value="0.6" /></label>
        <button id="play">Play</button>
        <div id="log" aria-live="polite"></div>
        <p><a href="./">← engine-specs demo</a></p>
      </div>
    </div>

    <script type="module">
      import {
        TOUCH_LAYOUTS,
        createInput,
        createTouchPad,
        exposeAsGamepad,
        connectTouchPad,
      } from '../src/engine-specs.js';

      const screen = document.querySelector('#screen');
      const canvas = screen.querySelector('canvas');
      const menu = document.querySelector('#menu');
      const log = document.querySelector('#log');
      const systems = document.querySelector('.systems');
      const opacity = document.querySelector('#opacity');

      const touch = matchMedia('(pointer: coarse)').matches;
      let system = new URLSearchParams(location.search).get('system') ?? 'megadrive';
      if (!(system in TOUCH_LAYOUTS)) system = 'megadrive';

      // What a host does: one input, one pad, the pad in getGamepads(), the two connected.
      const input = createInput();
      let pad = null;
      let release = () => {};
      let disconnect = () => {};
      const mountPad = () => {
        disconnect();
        release();
        pad?.destroy();
        pad = createTouchPad(document.body, {
          layout: system,
          opacity: Number(opacity.value),
          mode: touch ? 'auto' : 'always',
        });
        release = exposeAsGamepad(pad);
        disconnect = connectTouchPad(pad, input);
        pad.onLayout(fit);
        fit(pad.gameArea);
      };

      // The host fits the game into what the pad leaves.
      function fit(area) {
        const layout = TOUCH_LAYOUTS[system];
        const width = Math.min(area.width, area.height * layout.aspect);
        const height = width / layout.aspect;
        Object.assign(screen.style, {
          left: `${area.x + (area.width - width) / 2}px`,
          top: `${area.y + (area.height - height) / 2}px`,
          width: `${width}px`,
          height: `${height}px`,
        });
      }

      // A stand-in for the game: the console's name and the buttons held, read back
      // from navigator.getGamepads() exactly as an engine would.
      const ctx = canvas.getContext('2d');
      const names = { 12: '↑', 13: '↓', 14: '←', 15: '→' };
      function draw() {
        requestAnimationFrame(draw);
        if (screen.hidden) return;
        const layout = TOUCH_LAYOUTS[system];
        for (const key of [...layout.faces, layout.l, layout.r, layout.select, layout.start]) {
          if (key) names[key.index] = key.label;
        }
        const pads = [...navigator.getGamepads()].filter(Boolean);
        const held = pads.flatMap((p) => p.buttons.map((b, i) => (b.pressed ? names[i] ?? `#${i}` : null)).filter(Boolean));
        canvas.height = Math.round(canvas.width / layout.aspect);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '700 22px system-ui, sans-serif';
        ctx.fillText(layout.title, canvas.width / 2, canvas.height * 0.4);
        ctx.font = '600 18px system-ui, sans-serif';
        ctx.fillStyle = held.length ? '#ff79b8' : '#8e97a9';
        ctx.fillText(held.length ? held.join(' + ') : 'press something', canvas.width / 2, canvas.height * 0.6);
      }
      requestAnimationFrame(draw);

      const play = () => {
        menu.hidden = true;
        screen.hidden = false;
        input.suspend(); // the game has the controls: the pad shows
      };
      const backToMenu = () => {
        input.resume(); // a menu is open: the pad goes
        screen.hidden = true;
        menu.hidden = false;
        document.querySelector('#play').focus();
      };

      input.on((action, detail) => {
        log.textContent = `${action} · ${detail.source}`;
        if (action === 'menu' && input.suspended) backToMenu();
        else if (action === 'accept' && !input.suspended && document.activeElement instanceof HTMLButtonElement) {
          document.activeElement.click();
        }
      });

      const renderSystems = () => {
        systems.replaceChildren(
          ...Object.values(TOUCH_LAYOUTS).map((layout) => {
            const button = document.createElement('button');
            button.textContent = layout.title;
            button.setAttribute('aria-pressed', String(layout.system === system));
            button.addEventListener('click', () => {
              system = layout.system;
              history.replaceState(null, '', `?system=${system}`);
              renderSystems();
              mountPad();
            });
            return button;
          }),
        );
      };
      renderSystems();
      opacity.addEventListener('change', mountPad);
      document.querySelector('#play').addEventListener('click', play);
      mountPad();
      if (new URLSearchParams(location.search).has('play')) play();
    </script>
  </body>
</html>
