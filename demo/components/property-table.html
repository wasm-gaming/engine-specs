<!--
  What the four getters return, rendered as-is.

  This component is the argument for the descriptor: it is written once and paints
  `config()`, `options()`, `assets()` and `storage()` alike, for any engine, without
  knowing a single key name. Labels, defaults, allowed values and whether a property
  can change on a running engine all travel with the value.
-->
<div class="tables">
  <section class="props" :each="(table, tableIndex) in tables">
    <h3>{{ table.title }}<span class="paren">()</span></h3>
    <table>
      <tr :each="(row, index) in table.rows">
        <th>
          {{ row.key }}
          <span :if="row.live" class="live" title="Can be changed on a running engine">live</span>
        </th>
        <td class="value" :class.unset="row.unset">{{ row.value }}</td>
        <td class="meta">
          <span :if="row.description">{{ row.description }}</span>
          <span :if="row.default" class="aside">default: {{ row.default }}</span>
          <span :if="row.enum" class="aside">one of: {{ row.enum }}</span>
          <span :if="row.allowedTypes" class="aside">accepts: {{ row.allowedTypes }}</span>
        </td>
      </tr>
    </table>
  </section>
</div>

<script :setup="{
  tables = [],
}">
</script>
