<!--
  The engine's assets, each driven by its own descriptor.

  Everything shown comes from what `assets()` returned: the hint is the descriptor's
  `description`, and the file dialog's filter is its `allowedTypes`. The page
  hardcodes nothing about any asset — add a third one to the engine and it appears
  here on its own.
-->
<div class="pickers">
  <section class="drop" :each="(asset, index) in assets"
      :class.selected="asset.fileName"
      @dragover.prevent="dragging = asset.key"
      @dragleave="dragging = null"
      @drop.prevent="onDrop($event, asset)"
      :class.active="dragging === asset.key">
    <div class="meta">
      <strong>{{ asset.key }}</strong>
      <p class="hint">{{ asset.description }}</p>
      <p :class.file-selected="asset.fileName">{{ asset.fileName || asset.accepts }}</p>
    </div>
    <div class="picker-actions">
      <label class="picker">
        {{ asset.fileName ? 'Change' : 'Pick file' }}
        <input type="file" :accept="asset.accept" @change="onPick($event, asset)" />
      </label>
      <button type="button" :if="asset.fileName" class="remove-btn" @click.stop="$emit('remove', asset)">Remove</button>
    </div>
  </section>

</div>

<script :setup="{
  assets = [],
}">
  let dragging = null;

  const extractFile = (arg) => {
    if (!arg) return null;
    if (arg instanceof File) return arg;
    if (arg.detail instanceof File) return arg.detail;
    if (arg.target?.files?.item(0)) return arg.target.files.item(0);
    if (arg.dataTransfer?.files?.item(0)) return arg.dataTransfer.files.item(0);
    return null;
  };

  const onDrop = (event, asset) => {
    dragging = null;
    const file = extractFile(event);
    if (file) $emit('select', { key: asset.key, file });
  };

  const onPick = (event, asset) => {
    const file = extractFile(event);
    if (file) $emit('select', { key: asset.key, file });
  };
</script>

    gap: 0.6rem;
  }

  /*

    log fit the column without scrolling.

</style>
