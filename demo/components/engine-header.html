<!--
  The engine's identity, read off the class before anything is constructed.

  This is what replaced the manifest: `id`, `version`, `name` and `description` are
  static members of the SDK constructor, so a launcher can list engines without
  booting one.

  It sits at the foot of the page and says nothing about the site: the toolbar above
  carries that, which is why neither the link back to the reference nor a page-titling
  `h1` is here any more. The name still reaches the reader — as the document title,
  written from the same static member.
-->
<footer class="engine-header">
  <div>
    <p>{{ description }}</p>
  </div>
  <div class="right">
    <span class="pill">v{{ version }}</span>
  </div>
</footer>

<script :setup="{
  version,
  description = '',
}">
</script>

<style>
  /*
    Scoped to a class, not to the element. A component's styles land in the page's own
    <style>, unscoped — so a bare `header {}` here reached the site toolbar above and
    made a flex container of it, which centred the whole bar. Class selectors keep a
    component's look to the component.
  */
  .engine-header {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-top: 1px solid var(--border, #e2e8f0);
    background: var(--panel, #fff);
  }

  .engine-header p {
    margin: 0;
    color: var(--muted, #64748b);
  }

  .engine-header .right {
    display: flex;
    gap: 0.5rem;
  }

  .pill {
    border: 1px solid var(--accent, #ff007f);
    border-radius: 2px;
    padding: 0.25rem 0.6rem;
    font-family: var(--mono, monospace);
    font-size: 0.78rem;
    color: var(--accent, #ff007f);
    background: rgb(255 0 127 / 0.08);
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
